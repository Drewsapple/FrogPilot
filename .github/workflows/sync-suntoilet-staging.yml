name: Sync suntoilet staging branch

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to push changes to the repository
    
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Add suntoilet remote
        run: |
          if ! git remote get-url suntoilet > /dev/null 2>&1; then
            git remote add suntoilet https://github.com/suntoilet/suntoilet.git
          fi
          git fetch suntoilet
      
      - name: Merge suntoilet staging branch
        run: |
          if ! git merge suntoilet/staging --no-edit --allow-unrelated-histories; then
            echo "::error::Failed to merge suntoilet/staging branch. Merge conflicts detected."
            echo "::error::Please manually resolve conflicts and push the changes."
            echo "::error::Run: git fetch suntoilet && git merge suntoilet/staging"
            exit 1
          fi
      
      - name: Push to current repository
        if: success()
        run: |
          # Defensive check: ensure we're on a branch
          # (schedule and workflow_dispatch should always run on branches)
          if [[ "$GITHUB_REF" != refs/heads/* ]]; then
            echo "::warning::Workflow not running on a branch (ref: $GITHUB_REF). Skipping push."
            exit 0
          fi
          
          git push origin HEAD
